        <form

            novalidate

            <!-- =========================================

            <!-- =========================================

                type="tel"

                placeholder="Mobile Number"
                maxlength="20"

                inputmode="numeric"

            <!-- =========================================

            ========================================== -->

                type="email"
                id="email"
                name="email"
                placeholder="Email"

                autocomplete="email"
                required

            <!-- =========================================

            >


            <!-- =========================================

                type="text"

                maxlength="150"

                 MESSAGE
            ========================================== -->

                id="message"
                name="message"
                rows="6"
                maxlength="3000"
                placeholder="Type your message here..!"
                required
            ></textarea>


            <!-- =========================================
                 HIDDEN HONEYPOT
                 
                 Normal users never see this field.
                 Bots may automatically fill it.
            ========================================== -->

            <div
                class="website-field"
                aria-hidden="true"
                style="
                    position:absolute;
                    left:-9999px;
                    width:1px;
                    height:1px;
                    overflow:hidden;
                "
            >

                <label for="formWebsite">
                    Website
                </label>

                <input
                    type="text"
                    id="formWebsite"
                    name="formWebsite"
                    tabindex="-1"
                    autocomplete="off"
                    value=""
                >

            </div>


            <!-- =========================================
                 SUBMIT BUTTON
            ========================================== -->

            <button
                type="submit"
                id="submitButton"
            >
                Submit
            </button>


            <!-- =========================================
                 FORM STATUS
            ========================================== -->

                id="formStatus"

<script src="script.js"></script>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const CONTACT_API_URL =
    "https://script.google.com/macros/s/AKfycby2WJhYLBUwEGT_FPKK1qHqiOzmO98ufbe6xPTQ4ZMNEeok7r9s4aAVhq1A96kgwESoCA/exec";


/* =====================================================
   GET FORM ELEMENTS
===================================================== */

const form =
    document.getElementById("contactForm");

const submitButton =
    document.getElementById("submitButton");

const formStatus =
    document.getElementById("formStatus");

const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const emailInput =
    document.getElementById("email");

const websiteInput =
    document.getElementById("website");

const companyInput =
    document.getElementById("company");

const messageInput =
    document.getElementById("message");

const honeypotInput =
    document.getElementById("formWebsite");


/* =====================================================
   CONSTANTS
===================================================== */

const MAX_NAME_LENGTH = 100;

const MAX_MOBILE_LENGTH = 20;

const MAX_EMAIL_LENGTH = 150;

const MAX_WEBSITE_LENGTH = 500;

const MAX_COMPANY_LENGTH = 150;

const MAX_MESSAGE_LENGTH = 3000;


/* =====================================================
   REGULAR EXPRESSIONS
===================================================== */

/*
 * Name:
 *
 * Allows:
 * A-Z
 * a-z
 * spaces
 * apostrophe
 * hyphen
 * period
 *
 * Examples:
 *
 * Shailendra
 * Shailendra Kumar
 * O'Connor
 * Mary-Jane
 * Mr. Sharma
 */

const namePattern =
    /^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:[ .'-][A-Za-zÀ-ÖØ-öø-ÿ]+)*$/;


/*
 * Mobile:
 *
 * Allows:
 *
 * +919876543210
 * 919876543210
 * 9876543210
 *
 * Only digits after optional +.
 */

const mobilePattern =
    /^\+?[0-9]{7,20}$/;


/*
 * Email:
 *
 * Basic but practical email validation.
 */

const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;


/*
 * Company:
 *
 * Allows:
 *
 * Letters
 * Numbers
 * Spaces
 * &
 * .
 * ,
 * '
 * -
 * /
 * (
 * )
 */

const companyPattern =
    /^[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:[ &.,'()\/-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*$/;


/* =====================================================
   ALLOW ONLY VALID MOBILE CHARACTERS
===================================================== */

mobileInput.addEventListener(
    "input",
    function () {

        let value =
            this.value;

        /*
         * Remove everything except:
         *
         * numbers
         * +
         */

        value =
            value.replace(
                /[^0-9+]/g,
                ""
            );


        /*
         * + is allowed only at the
         * beginning.
         */

        if (value.includes("+")) {

            value =
                "+" +
                value
                    .replace(/\+/g, "")
                    .replace(/\D/g, "");

        }


        /*
         * Maximum 20 digits.
         */

        const hasPlus =
            value.startsWith("+");

        const digits =
            hasPlus
                ? value.substring(1)
                : value;

        value =
            (hasPlus ? "+" : "") +
            digits.substring(0, MAX_MOBILE_LENGTH);


        this.value =
            value;

    }
);


/* =====================================================
   REMOVE EXTRA SPACES FROM TEXT FIELDS
===================================================== */

function normalizeText(value) {

    return value
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   WEBSITE VALIDATION
===================================================== */

function isValidWebsite(value) {

    try {

        /*
         * Require explicit HTTP/HTTPS.
         *
         * Examples:
         *
         * https://example.com
         * http://example.com
         */

        if (
            !value.startsWith("http://") &&
            !value.startsWith("https://")
        ) {

            return false;

        }


        const url =
            new URL(value);


        if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
        ) {

            return false;

        }


        /*
         * A hostname must exist.
         */

        if (!url.hostname) {

            return false;

        }


        /*
         * Basic hostname validation.
         */

        if (
            !url.hostname.includes(".") &&
            url.hostname !== "localhost"
        ) {

            return false;

        }


        return true;

    } catch (error) {

        return false;

    }

}


/* =====================================================
   STATUS FUNCTIONS
===================================================== */

function showError(message) {

    formStatus.textContent =
        message;

    formStatus.style.color =
        "#ffb4b4";

}


function showSuccess(message) {

    formStatus.textContent =
        message;

    formStatus.style.color =
        "#b7ffcf";

}


/* =====================================================
   CLEAR STATUS
===================================================== */

function clearStatus() {

    formStatus.textContent =
        "";

    formStatus.style.color =
        "";

}


/* =====================================================
   VALIDATE FORM
===================================================== */

function validateForm() {

    clearStatus();

    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();

    const email =
        emailInput.value.trim();

    const website =
        websiteInput.value.trim();

    const company =
        companyInput.value.trim();

    const message =
        messageInput.value.trim();


    /* =============================================
       CHECK EVERY FIELD
    ============================================== */

    if (!name) {

        showError("Please enter your name.");
        nameInput.focus();
        return false;

    }


    if (!mobile) {

        showError("Please enter your mobile number.");
        mobileInput.focus();
        return false;

    }


    if (!email) {

        showError("Please enter your email address.");
        emailInput.focus();
        return false;

    }


    if (!website) {

        showError("Please enter your website URL.");
        websiteInput.focus();
        return false;

    }


    if (!company) {

        showError("Please enter your company name.");
        companyInput.focus();
        return false;

    }


    if (!message) {

        showError("Please enter your message.");
        messageInput.focus();
        return false;

    }


    /* =============================================
       NAME
    ============================================== */

    if (
        name.length > 100
    ) {

        showError(
            "Name cannot exceed 100 characters."
        );

        nameInput.focus();

        return false;

    }


    if (
        !namePattern.test(name)
    ) {

        showError(
            "Name can contain only letters, spaces, hyphens, apostrophes and periods."
        );

        nameInput.focus();

        return false;

    }


    /* =============================================
       MOBILE
    ============================================== */

    if (
        !mobilePattern.test(mobile)
    ) {

        showError(
            "Please enter a valid mobile number."
        );

        mobileInput.focus();

        return false;

    }


    /* =============================================
       EMAIL
    ============================================== */

    if (
        email.length > 150
    ) {

        showError(
            "Email cannot exceed 150 characters."
        );

        emailInput.focus();

        return false;

    }


    if (
        !emailPattern.test(email)
    ) {

        showError(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return false;

    }


    /* =============================================
       WEBSITE
    ============================================== */

    if (
        website.length > 500
    ) {

        showError(
            "Website URL cannot exceed 500 characters."
        );

        websiteInput.focus();

        return false;

    }


    if (
        !isValidWebsite(website)
    ) {

        showError(
            "Please enter a valid website URL starting with http:// or https://."
        );

        websiteInput.focus();

        return false;

    }


    /* =============================================
       COMPANY
    ============================================== */

    if (
        company.length > 150
    ) {

        showError(
            "Company cannot exceed 150 characters."
        );

        companyInput.focus();

        return false;

    }


    if (
        !companyPattern.test(company)
    ) {

        showError(
            "Company name contains invalid characters."
        );

        companyInput.focus();

        return false;

    }


    /* =============================================
       MESSAGE
    ============================================== */

    if (
        message.length < 5
    ) {

        showError(
            "Message must contain at least 5 characters."
        );

        messageInput.focus();

        return false;

    }


    if (
        message.length > 3000
    ) {

        showError(
            "Message cannot exceed 3000 characters."
        );

        messageInput.focus();

        return false;

    }


    if (
        !/[A-Za-zÀ-ÖØ-öø-ÿ0-9]/.test(message)
    ) {

        showError(
            "Please enter a meaningful message."
        );

        messageInput.focus();

        return false;

    }


    /* =============================================
       HONEYPOT
    ============================================== */

    if (
        honeypotInput.value.trim() !== ""
    ) {

        showError(
            "Unable to submit the form."
        );

        return false;

    }


    return true;

}



/* =====================================================
   FORM SUBMISSION
===================================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /*
         * Validate everything before
         * sending anything to Google Apps Script.
         */

        if (!validateForm()) {

            return;

        }


        /* -------------------------------------------
           GET CLEAN VALUES
        -------------------------------------------- */

        const name =
            normalizeText(
                nameInput.value
            );

        const mobile =
            mobileInput.value.trim();

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const website =
            websiteInput.value.trim();

        const company =
            normalizeText(
                companyInput.value
            );

        const message =
            messageInput.value.trim();


        /* -------------------------------------------
           DISABLE BUTTON
        -------------------------------------------- */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Sending...";


        clearStatus();


        try {

            /* ---------------------------------------
               SEND DATA TO GOOGLE APPS SCRIPT
            ---------------------------------------- */

            const response =
                await fetch(
                    CONTACT_API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                mobile:
                                    mobile,

                                email:
                                    email,

                                website:
                                    website,

                                company:
                                    company,

                                message:
                                    message,

                                formWebsite:
                                    honeypotInput.value

                            })
                    }
                );


            /* ---------------------------------------
               READ RESPONSE
            ---------------------------------------- */

            let result = {};

            try {

                result =
                    await response.json();

            } catch (jsonError) {

                result = {};

            }


            /* ---------------------------------------
               CHECK SERVER RESPONSE
            ---------------------------------------- */

            if (
                !response.ok
            ) {

                throw new Error(
                    "Server returned an error."
                );

            }


            if (
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Unable to submit your message."
                );

            }


            /* ---------------------------------------
               SUCCESS
            ---------------------------------------- */

            form.reset();


            showSuccess(
                "Message sent successfully. Thank you for contacting me!"
            );


        } catch (error) {

            console.error(
                "Contact form error:",
                error
            );


            showError(
                error.message ||
                "Something went wrong. Please try again later."
            );


        } finally {

            /* ---------------------------------------
               ENABLE BUTTON AGAIN
            ---------------------------------------- */

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit";

        }

    }
);


/* =====================================================
   PREVENT PASTE OF INVALID MOBILE DATA
===================================================== */

mobileInput.addEventListener(
    "paste",
    function (event) {

        const pastedText =
            (
                event.clipboardData ||
                window.clipboardData
            ).getData("text");


        /*
         * Allow only a valid mobile
         * character set.
         */

        if (
            !/^\+?[0-9\s\-()]+$/.test(
                pastedText
            )
        ) {

            event.preventDefault();

        }

    }
);


/* =====================================================
   EMAIL NORMALIZATION
===================================================== */

emailInput.addEventListener(
    "blur",
    function () {

        this.value =
            this.value
                .trim()
                .toLowerCase();

    }
);


/* =====================================================
   NORMALIZE TEXT INPUTS
===================================================== */

nameInput.addEventListener(
    "blur",
    function () {

        this.value =
            normalizeText(
                this.value
            );

    }
);


companyInput.addEventListener(
    "blur",
    function () {

        this.value =
            normalizeText(
                this.value
            );

    }
);


messageInput.addEventListener(
    "blur",
    function () {

        this.value =
            this.value.trim();

    }
);


/* =====================================================
   CLEAR ERROR WHEN USER STARTS CORRECTING
===================================================== */

[
    nameInput,
    mobileInput,
    emailInput,
    websiteInput,
    companyInput,
    messageInput
].forEach(
    function (input) {

        input.addEventListener(
            "input",
            function () {

                if (
                    formStatus.textContent
                ) {

                    clearStatus();

                }

            }
        );

    }
);

</script>
